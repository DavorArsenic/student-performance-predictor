<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Performance Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">

    <div class="card shadow-lg">

        <div class="card-header text-center">
            <h1 class="mb-0">Student Performance Predictor</h1>
        </div>

        <div class="card-body">

            <form action="/predict" method="post">

                <h4>Required Information</h4>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number"
                    class="form-control"
                    name="age"
                    min="15"
                    max="22"
                    value="{{ age if age is defined else '' }}"
                    required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Study Time (1-4)</label>
                    <input type="number"
                    class="form-control"
                    name="studytime"
                    min="1"
                    max="4"
                    value="{{ studytime if studytime is defined else '' }}"
                    required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Previous Failures (0-4)</label>
                    <input type="number"
                    class="form-control"
                    name="failures"
                    min="0"
                    max="4"
                    value="{{ failures if failures is defined else '' }}"
                    required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Absences</label>
                    <input type="number"
                    class="form-control"
                    name="absences"
                    min="0"
                    value="{{ absences if absences is defined else '' }}"
                    required>

                <hr>

                <h4>Optional Information</h4>

                <p class="text-muted">
                    Leave empty to use default values.
                </p>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="sex">
                        <option value="">Default</option>

                        <option value="F"
                            {% if sex is defined and sex == "F" %}
                            selected
                            {% endif %}>
                            Female
                        </option>

                        <option value="M"
                            {% if sex is defined and sex == "M" %}
                            selected
                            {% endif %}>
                            Male
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mother's Education (0-4)</label>
                    <input type="number"
                    class="form-control"
                    name="Medu"
                    min="0"
                    max="4"
                    value="{{ Medu if Medu is defined else '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Father's Education (0-4)</label>
                    <input type="number"
                    class="form-control"
                    name="Fedu"
                    min="0"
                    max="4"
                    value="{{ Fedu if Fedu is defined else '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Internet Access</label>
                    <select class="form-select" name="internet">

                    <option value="">Default</option>

                    <option value="yes"
                        {% if internet is defined and internet == "yes" %}
                        selected
                        {% endif %}>
                        Yes
                    </option>

                    <option value="no"
                        {% if internet is defined and internet == "no" %}
                        selected
                        {% endif %}>
                        No
                    </option>

                </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Weekend Alcohol Consumption (1-5)</label>
                    <input type="number"
                    class="form-control"
                    name="Walc"
                    min="0"
                    max="5"
                    value="{{ Walc if Walc is defined else '' }}">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Predict Grade
                </button>

            </form>

            {% if prediction %}

            <div class="result-box mt-5">

                <h3>Prediction Result</h3>

                <div class="result-score">
                    {{ prediction }}/20
                </div>

                <div class="result-grade">
                    Grade {{ grade }}
                </div>

                <div class="result-label">
                    {{ label }}
                </div>

            </div>

            {% endif %}

        </div>

    </div>

</div>

</body>
</html>
